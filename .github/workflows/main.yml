name: Generate SBOM

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

jobs:
  Generate-sbom:
    runs-on: ubuntu-latest
    name: Generate SBOM
    steps:
      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate SBOM
        uses: manifest-cyber/manifest-github-action@6bf8917b77e9d721d7971dfae955b968ab3bd817 # main
        with:
          apiKey: ${{ secrets.MANIFEST_API_KEY }}
          asset-labels: "github-action, production"
          generator: "syft"
